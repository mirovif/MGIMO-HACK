<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#303B48">
  <title>UTRET</title>
  <script>
    function openCover() {
      if (location.hash === '#education-universe') return;
      if (location.pathname === '/' && (location.hash === '#login' || location.hash.startsWith('#app/'))) {
        const route = location.hash === '#login' ? '' : location.hash;
        location.replace('/lks' + location.search + route);
        return;
      }
      if (location.hash) {
        history.replaceState(history.state, '', location.pathname + location.search);
      }
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    history.scrollRestoration = 'manual';
    if (typeof WebGL2RenderingContext === 'function' && !navigator.connection?.saveData) {
      const directToMap = location.hash === '#education-universe';
      const mapBundle = document.createElement('link');
      mapBundle.rel = 'modulepreload';
      mapBundle.href = '/education-universe/scene.bundle.mjs';
      mapBundle.fetchPriority = directToMap ? 'high' : 'low';
      document.head.append(mapBundle);
      if (directToMap && typeof DecompressionStream === 'function') {
        const graph = document.createElement('link');
        graph.rel = 'preload';
        graph.as = 'fetch';
        graph.href = '/education-universe/data/education_universe.graph.json.gz';
        graph.crossOrigin = 'anonymous';
        document.head.append(graph);
      }
    }
    openCover();
    window.addEventListener('pageshow', ({ persisted }) => {
      if (persisted) openCover();
    });
    window.addEventListener('hashchange', () => {
      if (['#campus', '#relief-story-title', '#team'].includes(location.hash)) openCover();
    });
  </script>
  <link rel="icon" href="data:,">
  <link rel="preload" as="image" href="/assets/campus-still-fast.webp" fetchpriority="high">
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/utret-theme.css">
  <link rel="stylesheet" href="/preview/shared.css">
  <link rel="stylesheet" href="/preview/05.css">
  <link rel="stylesheet" href="/preview/05-kameta.css">
  <link rel="stylesheet" href="/kameta-wave.css">
  <link rel="stylesheet" href="/preview/05-team.css">
  <link rel="stylesheet" href="/education-universe/booklet.css">
  <link rel="stylesheet" href="/education-universe/universe.css">
  <link rel="modulepreload" href="/education-universe/universe.mjs">
  <link rel="modulepreload" href="/education-universe/graph.mjs">
  <script type="module" src="/preview/05.mjs"></script>
</head>
<body class="relief">
</body>
</html>
